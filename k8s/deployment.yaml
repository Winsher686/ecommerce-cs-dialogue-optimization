apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-api
  labels:
    app: cs-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs-api
  template:
    metadata:
      labels:
        app: cs-api
    spec:
      containers:
        - name: cs-api
          image: your-registry/cs-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cs-api-config
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: model-volume
              mountPath: /app/outputs
            - name: log-volume
              mountPath: /app/logs
      volumes:
        - name: model-volume
          persistentVolumeClaim:
            claimName: cs-model-pvc
        - name: log-volume
          emptyDir: {}