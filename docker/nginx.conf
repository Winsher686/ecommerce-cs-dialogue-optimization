worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream base_model {
        server api-base:8000;
    }

    upstream finetuned_model {
        server api-finetuned:8000;
    }

    # 按 10% / 90% 分流
    split_clients "${remote_addr}${request_id}" $model_pool {
        10%     finetuned_model;
        *       base_model;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://$model_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://base_model/health;
        }

        # 快速回滚：把下面这段取消注释，即可 100% 走 base
        # location / {
        #     proxy_pass http://base_model;
        # }
    }
}