model_name_or_path: Qwen/Qwen3-8B
dataset_path: data/processed/sft_dataset_mixed.jsonl
output_dir: outputs/sft

seed: 42
max_seq_len: 2048

num_train_epochs: 1
per_device_train_batch_size: 8
gradient_accumulation_steps: 16
learning_rate: 2e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
optim: adamw_torch
bf16: true
fp16: false
gradient_checkpointing: true
merge_and_save: true
merged_output_dir: outputs/sft_merged
logging_steps: 10
save_steps: 500

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
