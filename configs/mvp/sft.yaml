model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
dataset_path: data/processed/sft_dataset_mixed.jsonl
output_dir: outputs/mvp/sft

seed: 42
max_seq_len: 1024

num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
optim: adamw_torch
bf16: false
fp16: false
merge_and_save: true
merged_output_dir: outputs/mvp/sft_merged
logging_steps: 5
save_steps: 50

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
