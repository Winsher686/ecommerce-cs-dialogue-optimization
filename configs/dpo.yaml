base_model: Qwen/Qwen3-8B
model_name_or_path: outputs/sft
dataset_path: data/processed/dpo_dataset.jsonl
output_dir: outputs/dpo

seed: 42
max_seq_len: 2048
max_prompt_len: 1024

num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-5
beta: 0.1
loss_type: dpo
bf16: true
logging_steps: 10
save_steps: 500
